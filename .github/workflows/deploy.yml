name: Build, test and deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC federation: no secrets, only IDs stored as repository variables.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/api-ts/package-lock.json
            src/frontend/package-lock.json
      - name: API build and tests
        working-directory: src/api-ts
        run: |
          npm ci
          npm run build
          npm test -- --run
      - name: Frontend build
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/private-network.bicep
      - name: Test exclusive API shutdown
        run: bash .github/scripts/stop-api-revisions.test.sh

  deploy:
    timeout-minutes: 45
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision private network and replacement environment
        id: platform
        run: |
          az deployment group create -g "$RG" -f infra/private-network.bicep \
            -p infra/main.parameters.json deployApps=false \
            --query properties.outputs -o json > platform.json
          echo "acr=$(jq -er .acrName.value platform.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        run: |
          az acr build -r "${{ steps.platform.outputs.acr }}" -t "api:$TAG" \
            -f src/api-ts/Dockerfile src
          az acr build -r "${{ steps.platform.outputs.acr }}" -t "frontend:$TAG" \
            src/frontend

      # SQLite on Azure Files must have a single writer. The API runs in multiple-revision
      # mode, so deactivate every existing revision and wait for its replicas to stop
      # before the new revision is created.
      - name: Stop old API revisions (exclusive SQLite access)
        run: |
          legacy=$(jq -er .legacyApiAppName.value platform.json)
          api=$(jq -er .apiAppName.value platform.json)
          bash .github/scripts/stop-api-revisions.sh "$RG" "$legacy" "$api"
      - name: Deploy container apps
        id: apps
        run: |
          az deployment group create -g "$RG" -f infra/private-network.bicep \
            -p infra/main.parameters.json deployApps=true imageTag="$TAG" \
            apiRevisionSuffix="g${{ github.run_id }}-${{ github.run_attempt }}" \
            --query properties.outputs -o json > outputs.json
          echo "frontend=$(jq -r .frontendUrl.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "api=$(jq -r .apiUrl.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for url in "${{ steps.apps.outputs.api }}/api/products" "${{ steps.apps.outputs.frontend }}/"; do
            for i in $(seq 1 20); do
              code=$(curl --connect-timeout 10 --max-time 20 -sS -o response.json -w '%{http_code}' "$url") || code=000
              echo "$url -> $code"
              if [ "$code" = "200" ]; then
                if [[ "$url" != */api/products ]] || jq -e 'type == "array" and length > 0 and all(.[]; has("productId") and has("name"))' response.json; then
                  continue 2
                fi
                echo "Products endpoint did not return a non-empty product list"
              fi
              sleep 15
            done
            echo "Smoke test failed for $url"; exit 1
          done
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${{ steps.apps.outputs.frontend }}" >> "$GITHUB_STEP_SUMMARY"
