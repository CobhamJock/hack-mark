name: Build, test and deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC federation: no secrets, only IDs stored as repository variables.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/api-ts/package-lock.json
            src/frontend/package-lock.json
      - name: API build and tests
        working-directory: src/api-ts
        run: |
          npm ci
          npm run build
          npm test -- --run
      - name: Frontend build
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision platform (registry, storage, environment)
        id: platform
        run: |
          az deployment group create -g "$RG" -f infra/main.bicep \
            -p infra/main.parameters.json deployApps=false \
            --query properties.outputs.acrName.value -o tsv > acr.txt
          echo "acr=$(cat acr.txt)" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        run: |
          az acr build -r "${{ steps.platform.outputs.acr }}" -t "api:$TAG" \
            -f api-ts/Dockerfile src
          az acr build -r "${{ steps.platform.outputs.acr }}" -t "frontend:$TAG" \
            src/frontend

      # SQLite on Azure Files must have a single writer. The API runs in multiple-revision
      # mode, so deactivate every existing revision and wait for its replicas to stop
      # before the new revision is created.
      - name: Stop old API revisions (exclusive SQLite access)
        run: |
          api=$(az containerapp list -g "$RG" --query "[?ends_with(name,'-api')].name | [0]" -o tsv)
          if [ -n "$api" ]; then
            # --all includes inactive revisions, so the shutdown check still covers
            # revisions deactivated by this step or earlier runs
            revs=$(az containerapp revision list -g "$RG" -n "$api" --all --query "[].name" -o tsv)
            for rev in $(az containerapp revision list -g "$RG" -n "$api" --query "[?properties.active].name" -o tsv); do
              az containerapp revision deactivate -g "$RG" -n "$api" --revision "$rev"
            done
            for i in $(seq 1 30); do
              running=0
              for rev in $revs; do
                # a failed query must not be read as "no replicas"
                n=$(az containerapp replica list -g "$RG" -n "$api" --revision "$rev" --query "length(@)" -o tsv) || { echo "replica query failed"; exit 1; }
                running=$((running + n))
              done
              echo "API replicas still running: $running"
              [ "$running" -eq 0 ] && break
              [ "$i" -eq 30 ] && { echo "Old API replicas did not stop"; exit 1; }
              sleep 10
            done
          fi
      - name: Deploy container apps
        id: apps
        run: |
          az deployment group create -g "$RG" -f infra/main.bicep \
            -p infra/main.parameters.json deployApps=true imageTag="$TAG" \
            apiRevisionSuffix="g${{ github.run_id }}-${{ github.run_attempt }}" \
            --query properties.outputs -o json > outputs.json
          echo "frontend=$(jq -r .frontendUrl.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "api=$(jq -r .apiUrl.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for url in "${{ steps.apps.outputs.api }}/api/products" "${{ steps.apps.outputs.frontend }}/"; do
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              echo "$url -> $code"
              [ "$code" = "200" ] && continue 2
              sleep 15
            done
            echo "Smoke test failed for $url"; exit 1
          done
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${{ steps.apps.outputs.frontend }}" >> "$GITHUB_STEP_SUMMARY"
